name: NTFS parser hardening

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitizers-and-fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install compiler and build tools
        run: sudo apt-get update && sudo apt-get install --yes clang ninja-build

      - name: Configure parser tests and fuzz target
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DJUSTGIVEMYDISK_BUILD_APP=OFF
          -DBUILD_TESTING=ON
          -DJUSTGIVEMYDISK_ENABLE_SANITIZERS=ON
          -DJUSTGIVEMYDISK_BUILD_FUZZER=ON

      - name: Build
        run: cmake --build build-sanitized --target MftRecordParserTests MftRecordParserFuzz

      - name: Run regression tests with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Run bounded libFuzzer smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-sanitized/MftRecordParserFuzz -runs=2000 -max_len=2048
